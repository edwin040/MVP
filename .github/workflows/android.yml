name: Android APK Editions
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Lite and Full debug APKs
        run: gradle --no-daemon assembleLiteDebug assembleFullDebug
      - name: Verify APK outputs
        run: |
          test -s app/build/outputs/apk/lite/debug/app-lite-debug.apk
          test -s app/build/outputs/apk/full/debug/app-full-debug.apk
      - name: Upload Lite APK
        uses: actions/upload-artifact@v4
        with:
          name: MCGG-FAST-HAND-Lite
          path: app/build/outputs/apk/lite/debug/app-lite-debug.apk
          if-no-files-found: error
      - name: Upload Full APK
        uses: actions/upload-artifact@v4
        with:
          name: MCGG-FAST-HAND-Full
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error
